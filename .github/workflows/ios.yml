name: 打包 iPhone App（TestFlight）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App 版本號（例如 1.0、1.1）"
        required: true
        default: "1.0"

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ github.event.inputs.version }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: 檢查 Apple 金鑰是否已設定
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::還沒有設定 GitHub Secret：$v（設定方法見 README-iPhone.md）"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - name: 使用最新版 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 準備 App 的網頁檔
        run: bash scripts/prepare-www.sh

      - name: 安裝 Capacitor
        run: npm install --no-audit --no-fund

      - name: 建立 iPhone 專案
        run: npx cap add ios

      - name: 產生 App 圖示與啟動畫面
        continue-on-error: true
        run: npx @capacitor/assets generate --ios --iconBackgroundColor '#C2410C' --splashBackgroundColor '#F3F4F1'

      - name: 同步程式與外掛
        run: npx cap sync ios

      - name: 設定權限說明與版本號
        run: bash scripts/configure-ios.sh

      - name: 寫入 App Store Connect 金鑰
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: 打包並上傳到 TestFlight
        run: bash scripts/build-upload.sh
